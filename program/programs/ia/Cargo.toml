[package]
name = "ia"
version = "0.1.0"
description = "Internal Affairs: AI agents work real tasks with planted bait; the program records who takes it, pays the investigator whose plant caught a model, and keeps every model's purse growing while it holds"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "ia"

[features]
default = []
quick = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-sha256-hasher = "3"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
